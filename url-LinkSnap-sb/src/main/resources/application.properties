spring.application.name=url-LinkSnap-sb

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/link_snap}
spring.datasource.username=${DATABASE_NAME}
spring.datasource.password=${DATABASE_PASS}
spring.jpa.hibernate.ddl-auto=update

#spring.jpa.properties.hibernate.dialect

jwt.secrect=${JWT_SECRECT_KEY:}
jwt.expiration=${JWT_EXPIRATION_TIME:}

logging.level.org.springframework.security=DEBUG
logging.level.org.url.shortener=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web.servlet=TRACE

